# Ekilie Box configuration.
#
# Every top-level key belongs to a linked extension. Run `ekilie-box config` to list every section this binary knows,
# with its defaults and documentation. Secrets are referenced as $NAME and read from .env beside this file; they are
# not exported to the app or JS hooks unless listed in app.env_allow.

app:
  dir: ekilie_box_data
  hooks_dir: ekilie_box_hooks
  migrations_dir: ekilie_box_migrations

server:
  http: 127.0.0.1:8090
  # https: ":443"
  index_fallback: true
  # public_dir: ./pb_public   # optional static files served at /

# Compact SQLite databases weekly. Admins can change this in Settings → Backups.
vacuum:
  enabled: true
  every: 168h

# Point-in-time restore. History is kept in ekilie_box_data/litestream/; restore from Settings → Backups.
pitr:
  enabled: true
  retention: 72h
  snapshot_interval: 24h
